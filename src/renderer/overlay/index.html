<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>umveil overlay</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        -webkit-app-region: drag;
      }
      button {
        -webkit-app-region: no-drag;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        border: 1px solid #555;
        backdrop-filter: blur(6px);
        letter-spacing: 0.04em;
        transition: background 100ms;
      }
      button:hover { background: rgba(30, 30, 30, 0.95); }
    </style>
  </head>
  <body>
    <button id="return-btn">↩ Return to umveil</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
